<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hermes — Agent Operations Console</title>
<link rel="stylesheet" href="/styles.css?v=1.5.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'><defs><linearGradient id='g' x1='0' y1='0' x2='.6' y2='1'><stop offset='0%' stop-color='%23FFE6A8'/><stop offset='45%' stop-color='%23F5B93B'/><stop offset='100%' stop-color='%23B87A14'/></linearGradient><linearGradient id='w' x1='0' y1='0' x2='1' y2='.7'><stop offset='0%' stop-color='%23A8B3FF'/><stop offset='55%' stop-color='%235C6CF2'/><stop offset='100%' stop-color='%23323FB0'/></linearGradient><g id='f'><path d='M0 0C13-7 30-10 45-6C31 1 14 4 0 3Z' fill='url(%23w)'/><path d='M-.5 7C11 1.5 26 0 39 4C26 9.5 12 11.5-.5 10.5Z' fill='url(%23w)' opacity='.75'/><path d='M-1 14C9 9.5 21 9 32 12.5C21 17 10 18.5-1 17.5Z' fill='url(%23w)' opacity='.5'/></g></defs><rect width='128' height='128' rx='28' fill='%230B0E1D'/><g transform='translate(64,46)'><g transform='translate(11,0) rotate(-9)'><use href='%23f'/></g><g transform='translate(-11,0) rotate(9) scale(-1,1)'><use href='%23f'/></g></g><rect x='45.5' y='30' width='9' height='66' rx='4.5' fill='url(%23g)'/><rect x='73.5' y='30' width='9' height='66' rx='4.5' fill='url(%23g)'/><rect x='45.5' y='58.5' width='37' height='9' rx='4.5' fill='url(%23g)'/><circle cx='64' cy='24' r='6' fill='url(%23g)'/><circle cx='64' cy='102' r='4' fill='%234FD1A5'/></svg>">
<meta name="theme-color" content="#0B0E1D">
<meta name="description" content="Hermes — a local-first console for running a team of AI agents that pick up their own queue, do the work, and pass a quality gate before calling it done.">
<meta name="color-scheme" content="dark light">
<script>
  /* Runs before the first paint: a theme applied from JS after load would show
     a flash of the wrong ground. No stored choice means follow the OS. */
  (function () {
    try {
      var saved = localStorage.getItem('hermes.theme');
      var theme = saved || (window.matchMedia &&
        window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
  })();
</script>
</head>
<body>
<a class="skip" href="#view">Skip to content</a>

<!-- ==================== brand mark (reused by <use>) ==================== -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FFD98A"/>
      <stop offset="50%"  stop-color="#F5B93B"/>
      <stop offset="100%" stop-color="#C98A1C"/>
    </linearGradient>
    <linearGradient id="hw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#7C8BFF"/>
      <stop offset="100%" stop-color="#4C5BD4"/>
    </linearGradient>
    <symbol id="mark" viewBox="0 0 48 48">
      <!-- winged caduceus H: the messenger, rendered as an operations glyph -->
      <path d="M6 15 L2 19 L6 23 L13 19 Z"  fill="url(#hw)" opacity=".85"/>
      <path d="M42 15 L46 19 L42 23 L35 19 Z" fill="url(#hw)" opacity=".85"/>
      <path d="M9 25 L4 28 L9 31 L15 28 Z"  fill="url(#hw)" opacity=".5"/>
      <path d="M39 25 L44 28 L39 31 L33 28 Z" fill="url(#hw)" opacity=".5"/>
      <rect x="15" y="8"  width="4.5" height="32" rx="2.2" fill="url(#hg)"/>
      <rect x="28.5" y="8" width="4.5" height="32" rx="2.2" fill="url(#hg)"/>
      <rect x="15" y="21.5" width="18" height="4.5" rx="2.2" fill="url(#hg)"/>
      <circle cx="24" cy="6"  r="3" fill="url(#hg)"/>
      <circle cx="24" cy="42" r="2" fill="url(#hw)"/>
    </symbol>
  </defs>
</svg>

<!-- ==================== lock screen ==================== -->
<div class="lock" id="lock" hidden>
  <div class="lock-box">
    <svg class="brand-mark"><use href="#mark"/></svg>
    <h2>Hermes is locked</h2>
    <p>Paste the session token from your terminal, or reopen Hermes using the link it printed.</p>
    <input id="tokenInput" placeholder="session token" autocomplete="off" spellcheck="false">
    <div style="height:12px"></div>
    <button class="btn btn-primary" style="width:100%" onclick="App.unlock()">Unlock console</button>
    <p style="margin-top:16px;font-size:11.5px">Run <span class="mono">hermes serve</span> to see your token.</p>
  </div>
</div>

<!-- ==================== app shell ==================== -->
<div class="shell" id="shell" hidden>
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-row">
        <svg class="brand-mark"><use href="#mark"/></svg>
        <div class="brand-text">
          <div class="brand-name">HERMES</div>
          <div class="brand-sub">OpenClaw Runtime</div>
        </div>
      </div>
    </div>

    <nav class="nav" id="nav"></nav>

    <div class="sidebar-foot">
      <div class="wf-toggle" id="wfToggle" onclick="App.toggleWorkforce()">
        <span class="wf-dot"></span>
        <span class="wf-text">
          <b id="wfState">Workforce</b>
          <span id="wfDetail">checking…</span>
        </span>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <h1 id="viewTitle">Command</h1>
      <span class="sub" id="viewSub"></span>
      <div class="topbar-right">
        <button class="kbd-btn" onclick="App.palette()" title="Command palette" aria-label="Open the command palette">
          <span>Search</span><kbd id="palKey">⌘K</kbd>
        </button>
        <button class="icon-btn" id="themeBtn" onclick="App.toggleTheme()" title="Light / dark" aria-label="Switch between light and dark"></button>
        <button class="icon-btn" onclick="App.shortcuts()" title="Keyboard shortcuts" aria-label="Keyboard shortcuts">?</button>
        <span id="viewActions"></span>
      </div>
    </header>
    <div class="view" id="view"></div>
  </main>
</div>

<div class="toasts" id="toasts"></div>
<div id="overlay"></div>

<script src="/app.js?v=1.5.0"></script>
</body>
</html>
