<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hermes — Agent Operations Console</title>
<link rel="stylesheet" href="/styles.css?v=1.0.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>⚡</text></svg>">
</head>
<body>

<!-- ==================== brand mark (reused by <use>) ==================== -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FFD98A"/>
      <stop offset="50%"  stop-color="#F5B93B"/>
      <stop offset="100%" stop-color="#C98A1C"/>
    </linearGradient>
    <linearGradient id="hw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#7C8BFF"/>
      <stop offset="100%" stop-color="#4C5BD4"/>
    </linearGradient>
    <symbol id="mark" viewBox="0 0 48 48">
      <!-- winged caduceus H: the messenger, rendered as an operations glyph -->
      <path d="M6 15 L2 19 L6 23 L13 19 Z"  fill="url(#hw)" opacity=".85"/>
      <path d="M42 15 L46 19 L42 23 L35 19 Z" fill="url(#hw)" opacity=".85"/>
      <path d="M9 25 L4 28 L9 31 L15 28 Z"  fill="url(#hw)" opacity=".5"/>
      <path d="M39 25 L44 28 L39 31 L33 28 Z" fill="url(#hw)" opacity=".5"/>
      <rect x="15" y="8"  width="4.5" height="32" rx="2.2" fill="url(#hg)"/>
      <rect x="28.5" y="8" width="4.5" height="32" rx="2.2" fill="url(#hg)"/>
      <rect x="15" y="21.5" width="18" height="4.5" rx="2.2" fill="url(#hg)"/>
      <circle cx="24" cy="6"  r="3" fill="url(#hg)"/>
      <circle cx="24" cy="42" r="2" fill="url(#hw)"/>
    </symbol>
  </defs>
</svg>

<!-- ==================== lock screen ==================== -->
<div class="lock" id="lock" hidden>
  <div class="lock-box">
    <svg class="brand-mark"><use href="#mark"/></svg>
    <h2>Hermes is locked</h2>
    <p>Paste the session token from your terminal, or reopen Hermes using the link it printed.</p>
    <input id="tokenInput" placeholder="session token" autocomplete="off" spellcheck="false">
    <div style="height:12px"></div>
    <button class="btn btn-primary" style="width:100%" onclick="App.unlock()">Unlock console</button>
    <p style="margin-top:16px;font-size:11.5px">Run <span class="mono">hermes serve</span> to see your token.</p>
  </div>
</div>

<!-- ==================== app shell ==================== -->
<div class="shell" id="shell" hidden>
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-row">
        <svg class="brand-mark"><use href="#mark"/></svg>
        <div class="brand-text">
          <div class="brand-name">HERMES</div>
          <div class="brand-sub">OpenClaw Runtime</div>
        </div>
      </div>
    </div>

    <nav class="nav" id="nav"></nav>

    <div class="sidebar-foot">
      <div class="wf-toggle" id="wfToggle" onclick="App.toggleWorkforce()">
        <span class="wf-dot"></span>
        <span class="wf-text">
          <b id="wfState">Workforce</b>
          <span id="wfDetail">checking…</span>
        </span>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <h1 id="viewTitle">Command</h1>
      <span class="sub" id="viewSub"></span>
      <div class="topbar-right" id="viewActions"></div>
    </header>
    <div class="view" id="view"></div>
  </main>
</div>

<div class="toasts" id="toasts"></div>

<script src="/app.js?v=1.0.0"></script>
</body>
</html>
